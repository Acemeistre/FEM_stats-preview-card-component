<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="styles.css" rel="stylesheet" type="text/css">
  <title>Frontend Mentor | Stats preview card component</title>
</head>
<body>
  <main>
  <div class="wrapper">
    <div class="text">
      <h1>Get <span class="highlight">insights</span> that help your business grow.</h1>

      <p>Discover the benefits of data analytics and make better decisions regarding revenue, customer 
      experience, and overall efficiency.</p>
      <div class="stats">
        <div class="stat">
          <span class="stat-number">10k</span>
          <span class="stat-label">Companies</span>
        </div>
        <div class="stat">
          <span class="stat-number">314</span>
          <span class="stat-label">Templates</span>
        </div>
        <div class="stat">
          <span class="stat-number">12M+</span>
          <span class="stat-label">Queries</span>
        </div>
        </div>
      </div>
    <div class="photo-wrap">
      <img src="./images/image-header-desktop.jpg" alt="image of team in an office">
      <div class="purple-overlay"></div>
    </div>
  </div>
  </main>
</body>
</html>
